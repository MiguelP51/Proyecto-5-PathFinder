spring.application.name=backend
spring.profiles.active=dev

app.jwt.secret=PathFinderSecretKey2026PathFinderSecretKey2026
app.jwt.expiration-ms=86400000

app.admin.emails=jhuamanp@pucp.edu.pe
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/callback/{registrationId}

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

app.oauth2.authorized-redirect-uris=http://localhost:3000/home

server.forward-headers-strategy=FRAMEWORK

logging.level.com.pathfinder=DEBUG
logging.level.org.springframework.web=DEBUG

# AWS S3 (for local running)
aws.region=${AWS_REGION:us-east-1}
aws.bucket-name=${AWS_BUCKET_NAME:pathfinder-storage-dev}
aws.access-key=${AWS_ACCESS_KEY_ID:}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Spring Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}
