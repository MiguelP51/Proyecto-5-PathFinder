name: Deploy to AWS EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar variables
        run: |
          echo "HOST=${{ secrets.EC2_HOST_DEV }}" >> $GITHUB_ENV
          echo "USER=${{ secrets.EC2_USER_DEV }}" >> $GITHUB_ENV
          echo "KEY<<EOF" >> $GITHUB_ENV
          echo "${{ secrets.EC2_SSH_KEY_DEV }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Deploy en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USER }}
          key: ${{ env.KEY }}
          command_timeout: 20m
          script: |
            set -e

            echo "================================="
            echo " INICIANDO DEPLOY DEVELOP "
            echo "================================="

            cd /home/ubuntu/Proyecto-5-PathFinder

            echo "Actualizando repositorio..."
            git fetch --all
            git reset --hard origin/develop

            echo "Deteniendo contenedores..."
            docker compose down

            echo "Construyendo y levantando servicios..."
            # Intentamos levantar. Si falla (retorna código no-cero), ejecutamos la auto-limpieza
            if ! docker compose up -d --build; then
              echo " Falló la reconstrucción inicial. Ejecutando limpieza profunda de Docker para liberar espacio..."
              
              # Ejecutamos system prune para limpiar toda la caché de docker
              docker system prune -af
              
              echo "Reintentando construcción por segunda vez..."
              if ! docker compose up -d --build; then
                echo " DEPLOY INCOMPLETO: Falló la reconstrucción por segunda vez (revisa si es falta de espacio o un error de compilación)."
                exit 1
              fi
            fi

            echo "Limpiando imágenes huérfanas..."
            docker image prune -f

            echo "Verificando contenedores activos..."
            RUNNING_CONTAINERS=$(docker ps --filter "status=running" --format "{{.Names}}")
            
            if ! echo "$RUNNING_CONTAINERS" | grep -q "frontend" || ! echo "$RUNNING_CONTAINERS" | grep -q "backend"; then
              echo " DEPLOY INCOMPLETO: Los contenedores principales (frontend/backend) no se iniciaron correctamente."
              docker ps
              exit 1
            fi

            echo "Contenedores activos:"
            docker ps

            echo "================================="
            echo " DEPLOY COMPLETADO "
            echo "================================="


