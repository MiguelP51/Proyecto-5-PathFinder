events {}

http {

    # HTTP -> HTTPS
    server {
        listen 80;

        server_name pathfinder.2bd.net www.pathfinder.2bd.net;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;

        server_name pathfinder.2bd.net www.pathfinder.2bd.net;
        
        # Forzar www 
        if ($host = pathfinder.2bd.net) { 
            return 301 https://www.pathfinder.2bd.net$request_uri; 
        }
  
        ssl_certificate /etc/letsencrypt/live/pathfinder.2bd.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pathfinder.2bd.net/privkey.pem;
       
        #Limite para subida de CVs
        client_max_body_size 15M;

        location / {
            proxy_pass http://frontend:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme; 
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            #Necesario para NextJS hot reload y websockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }

		location /api/ {
			proxy_pass http://backend:8080;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

        location /swagger-ui/ {
            proxy_pass http://backend:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /swagger-ui.html {
            proxy_pass http://backend:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /v3/api-docs/ {
            proxy_pass http://backend:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /v3/api-docs {
            proxy_pass http://backend:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

		location /oauth2/ {
			proxy_pass http://backend:8080;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

        #NextAuth usa esta ruta internamente
        location /api/auth/ {
           proxy_pass http://frontend:3000; 
           
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr; 
           proxy_set_header X-Forwarded-Proto $scheme; 
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 

           proxy_http_version 1.1; 
           proxy_set_header Upgrade $http_upgrade; 
           proxy_set_header Connection "upgrade";
        }
    }
}
