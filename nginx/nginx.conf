events {}

http {

    # HTTP -> HTTPS
    server {
        listen 80;

        server_name pathfinder.work.gd www.pathfinder.work.gd;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;

        server_name pathfinder.work.gd www.pathfinder.work.gd;

        ssl_certificate /etc/letsencrypt/live/pathfinder.work.gd/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pathfinder.work.gd/privkey.pem;
       
        #Limite para subida de CVs
        client_max_body_size 15M;

        location / {
            proxy_pass http://frontend:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            #Necesario para NextJS hot reload y websockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }

        location /api/ {
            proxy_pass http://backend:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        #NextAuth usa esta ruta internamente
        location /api/auth/ {
            proxy_pass http://frontend:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
